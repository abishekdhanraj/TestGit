<template>
  <lightning-card title="Login Form">
    <div class="slds-p-around_medium">

      <lightning-input label="Username" type="text" value={username} onchange={handleUsername}>
      </lightning-input>

      <lightning-input label="Password" type="password" value={password} onchange={handlePassword}>
      </lightning-input>

      <br />

      <lightning-button label="Submit" variant="brand" onclick={handleSubmit}>
      </lightning-button>

    </div>
  </lightning-card>
</template>
